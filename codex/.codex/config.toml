model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

approval_policy = "on-request"
approvals_reviewer = "auto_review"

default_permissions = "claude-migrated"
service_tier = "default"

notify = ["/Users/nekorro/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[features]
hooks = true
js_repl = false
memories = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "used-tokens",
  "git-branch",
  "thread-id",
  "current-dir",
]

[tui.keymap.editor]
insert_newline = ["shift-enter", "ctrl-j"]

[permissions.claude-migrated]
description = "Global filesystem and network access with secret read denials."
extends = ":workspace"

[permissions.claude-migrated.filesystem]
":root" = "read"

[permissions.claude-migrated.filesystem."~"]
"." = "write"
"**/.env" = "deny"
"**/.env.local" = "deny"
".ssh/id_*" = "deny"

[permissions.claude-migrated.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.local" = "deny"

[permissions.claude-migrated.network]
enabled = true
allow_local_binding = true
dangerously_allow_all_unix_sockets = true

[permissions.claude-migrated.network.domains]
"*" = "allow"

[mcp_servers.smart-connections]
command = "/bin/sh"
args = ["-c", 'exec "$HOME/.codex/mcp/smart-connections.sh"']

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/nekorro/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/nekorro/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "iab"
BROWSER_USE_TINYSKY_ENABLED = "0"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.825.32147"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/nekorro/.codex/plugins/cache/openai-bundled/browser/26.825.32147/scripts/browser-service.mjs"}'
